name = "vants"
main = "worker.js"
compatibility_date = "2026-09-22"

# Observabilidad: logs de peticiones y errores visibles en el dashboard
# (útil para detectar ataques y tráfico de bots en Workers & Pages -> vants -> Logs)
[observability]
enabled = true

# Sirve los archivos estáticos de la carpeta public/
# binding + run_worker_first: TODA petición pasa primero por el Worker, donde se
# aplican cabeceras de seguridad, bloqueo de bots/scanners y rate limiting.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# Rutas limpias inexistentes (p.ej. /lo-que-sea) sirven 404.html con status 404,
# igual que hace la app de Vercel (playvants.vercel.app).
not_found_handling = "404-page"

# Puente de eventos de Discord hacia vantsbot (Neon Functions): el Worker
# verifica la firma Ed25519 del Developer Portal (/api/discord/events) y
# reenvía el evento a POST /evento-discord (auth x-vants-bot) para guardarlo
# en Neon (web_events) y avisar por DM de compras/instalaciones.
# D1 (todo en Cloudflare): la base de la plataforma es vants-db, la MISMA D1
# del bot (vantsbot) y de vants-functions. Binding DB.
[[d1_databases]]
binding = "DB"
database_name = "vants-db"
database_id = "11e5d82c-307b-44ba-9682-501d8df593d3"

# VANTS ACHIEVEMENTS & BADGE ENGINE — base D1 EXCLUSIVA del dominio de logros
# (catálogo, reglas, concesiones, outbox/inbox, entitlements y auditoría).
# vants-db (binding DB) solo se LEE como espejo de datos competitivos, NUNCA
# se escribe desde el engine. Sin esta binding el motor responde 503
# logros_no_config y TODO lo demás sigue funcionando igual (degradación
# honesta, documentada en docs/achievements/DECISIONS.md).
[[d1_databases]]
binding = "ACH_DB"
database_name = "vants-logros-db"
database_id = "481584c7-bc47-434b-aa73-3aa066b440f7"

# Pump del Transactional Outbox cada minuto (patrón Outbox/Inbox; Queues
# requiere plan de pago — decisión documentada en docs/achievements/DECISIONS.md).
# Sin ACH_DB el scheduled() es un no-op silencioso.
[triggers]
crons = ["* * * * *"]

[vars]
# Bot de Discord en Cloudflare (antes: ...-vantsbot...neon.tech, eliminado)
VANTS_BOT_URL = "https://vantsbot.vants.workers.dev"

# VANTS · AgentID (AgentMail): login para agentes de IA. La app está
# registrada en console.agentid.com con ESTA misma URI de callback.
# AGENTID_CLIENT_SECRET y VANTS_SESION_SEC viven como secrets del worker.
# AGENTID_SOLO_VERIFICADOS="1": solo agentes con dueño identificado
# (owner_human_verified u owner_email_verified en el token de AgentID).
AGENTID_CLIENT_ID = "fabe85f8-b37a-4f98-940d-582b45b1c961"
AGENTID_SOLO_VERIFICADOS = "1"

# VANTS-BUS: el Worker publica inscription.created (al inscribir un equipo),
# clip.published (al publicar un clip destacado) y match.finished (al cerrar
# una partida de bracket). Si falta el secreto, la publicación queda apagada
# y todo lo demás funciona igual. El secreto va aparte (no en el repo):
#   npx wrangler secret put VANTS_BUS_SECRET
VANTS_BUS_URL = "https://vants-bus.vants.workers.dev"

# DOMINIO PROPIO (vantsgg.com) — descomentar cuando la zona vantsgg.com esté
# activa en la cuenta de Cloudflare (o añadirlo por panel: Workers & Pages ->
# vants -> Configuración -> Dominios y rutas -> Agregar dominio personalizado):
# routes = [
#   { pattern = "vantsgg.com", custom_domain = true },
#   { pattern = "www.vantsgg.com", custom_domain = true },
# ]

# R2 para recursos gráficos versionados de insignias (badges/v1/<code>/*.png|webp):
# hoy la galería sirve los PNG/WebP como archivos estáticos de public/assets/badges,
# así que el binding queda DESCOMENTADO pendiente de necesidad real (misma decisión
# que en preview; ver docs/achievements/ASSETS.md).
# [[r2_buckets]]
# binding = "BADGE_ASSETS"
# bucket_name = "vants-badge-assets"
