# Réplica del worker de producción `vants` para el PREVIEW de la web GAMES.
# URL: https://vantsnet-preview.vants.workers.dev — NO toca producción `vants`.
# MISMO código, reglas y secretos, pero con D1 PROPIA (vants-preview-db): aquí
# se puede probar TODO (incluidas inscripciones y escrituras) sin ensuciar la
# base de producción. Sinopsis de datos: export de vants-db importado aquí.
name = "vantsnet-preview"
main = "worker.js"
compatibility_date = "2026-09-22"

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[vars]
# Bot de Discord en Cloudflare (antes: ...neon.tech, eliminado)
VANTS_BOT_URL = "https://vantsbot.vants.workers.dev"
VANTS_BUS_URL = "https://vants-bus.vants.workers.dev"

# VANTS · AgentID (AgentMail): login para agentes de IA con inbox verificado.
# client_id público (app registrada en console.agentid.com, 2 redirect URIs:
# staging y producción). AGENTID_CLIENT_SECRET y VANTS_SESION_SEC viven como
# secrets (wrangler secret put). El filtro de dueño identificado queda ACTIVO
# también en staging (mismo comportamiento que producción).
AGENTID_CLIENT_ID = "fabe85f8-b37a-4f98-940d-582b45b1c961"
AGENTID_SOLO_VERIFICADOS = "1"

# YOUTUBE · ÚLTIMOS DEL CANAL (/clips): canal oficial del dueño @feispla
# (confirmado por el dueño el 31-oct-2026). Opcionalmente, YOUTUBE_API_KEY como
# SECRET (wrangler secret put) para la Data API v3 (vistas/duración). Sin clave
# usa el RSS oficial del canal (suficiente: título, fecha y miniatura).
YOUTUBE_CHANNEL_ID = "UCOJzTjwvfQLlNP_OWSPcySQ"

# TWITCH · DISCOVERY (/streams): TWITCH_CLIENT_ID/TWITCH_CLIENT_SECRET viven como
# SECRETS del worker (wrangler secret put — nunca en el repo). EXPLORAR JUEGOS
# muestra SOLO la lista fija de la comunidad (Counter-Strike, League of Legends,
# VALORANT, EA Sports FC 27 y Fortnite — sin Just Chatting). EN DIRECTO y
# CREADORES VANTS muestran únicamente cuentas registradas en VANTS: esta var
# (creador oficial) + players.twitch_channel de D1, que escribe el perfil al
# conectar la Twitch (REDES Y CUENTAS).
VANTS_TWITCH_CREADORES = "feispla"

# D1 PROPIA del preview (antes apuntaba a vants-db de producción, pero el
# worker SÍ escribe: INSERT en tournament_teams y tournament_matches al
# inscribir equipos — las pruebas no deben tocar esos datos reales).
# Espejo de datos: wrangler d1 export vants-db --remote + import aquí.
[[d1_databases]]
binding = "DB"
database_name = "vants-preview-db"
database_id = "df295262-1da7-4483-addb-132310013ffc"

# ============================================================================
# VANTS ACHIEVEMENTS & BADGE ENGINE — SOLO PREVIEW (producción no se toca)
# Base D1 exclusiva del dominio de logros: catálogo, reglas, concesiones,
# outbox/inbox, entitlements y auditoría. Migración: db/logros/0001_logros_inicial.sql.
[[d1_databases]]
binding = "ACH_DB"
database_name = "vants-preview-db"
database_id = "df295262-1da7-4483-addb-132310013ffc"

# Pump del Transactional Outbox cada minuto (patrón Outbox/Inbox; Queues
# requiere plan de pago — decisión documentada en docs/achievements/DECISIONS.md).
[triggers]
crons = ["* * * * *"]

# R2 para los recursos gráficos de insignias. El bucket vants-badge-assets-preview
# EXISTE y ya contiene las 97 claves versionadas (badges/v1/<code>/*.png|webp),
# pero el BINDING queda descomentado PENDIENTE de un permiso del token API
# (subir objetos a R2 funciona; vincular el bucket al Worker devuelve 10085
# "bucket not found" — activarlo desde el panel o con un token con permiso
# R2:Edit a nivel de cuenta y descomentar las 3 líneas).
