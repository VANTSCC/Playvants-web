name = "vants-consumer-playvants"
main = "src/index.js"
compatibility_date = "2025-01-15"
account_id = "8f2424e95fec4860e19257226f209fbc"

# nodejs_compat: el driver postgres (postgres.js) abre TCP a la base de datos
# (pooler de Neon durante el paralelo, pooler de sesión de Supabase tras el corte).
compatibility_flags = ["nodejs_compat"]

[vars]
VANTS_BUS_URL = "https://vants-bus.vants.workers.dev"
FEED_RETENTION_DAYS = "7"

# Tiempo real: la cuota de Neon ya no limita la frecuencia (era la razón del
# */15). El feed lo consume la web con 1 minuto de desfase máximo.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
